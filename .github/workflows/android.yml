name: Android

# 每次推 main、发 PR、或者手动点一下，都跑一遍测试并出 APK。
# 打 tag（v1.0 这种）时额外把 APK 挂到 GitHub Release 上。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 打 tag 时创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 可选：配了这四个 secret 就出正式签名包，没配就只出 debug 包
      KEYSTORE_BASE64: ${{ secrets.KOMO_KEYSTORE_BASE64 }}
      KOMO_STORE_FILE: ${{ secrets.KOMO_KEYSTORE_BASE64 != '' && 'app/release-ci.jks' || '' }}
      KOMO_STORE_PASSWORD: ${{ secrets.KOMO_STORE_PASSWORD }}
      KOMO_KEY_ALIAS: ${{ secrets.KOMO_KEY_ALIAS }}
      KOMO_KEY_PASSWORD: ${{ secrets.KOMO_KEY_PASSWORD }}
      # 可选：弹弹play 开放平台凭证，没有就留空（该弹幕源不可用，其余功能不受影响）
      KOMO_DANDANPLAY_APP_ID: ${{ secrets.KOMO_DANDANPLAY_APP_ID }}
      KOMO_DANDANPLAY_APP_SECRET: ${{ secrets.KOMO_DANDANPLAY_APP_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # 没有 wrapper 校验和文件，别让校验步骤报错
          validate-wrappers: false

      # 仓库是在 Windows 上提交的，git 里可能没带可执行位，先补一下
      - name: 准备 wrapper
        run: chmod +x gradlew

      - name: 还原签名文件
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-ci.jks
          ls -l app/release-ci.jks

      - name: 跑单元测试
        run: ./gradlew test --console=plain

      - name: 构建 APK
        run: |
          chmod +x gradlew
          if [ -f app/release-ci.jks ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
          else
            echo "没有配签名 secret，只出 debug 包"
            ./gradlew :app:assembleDebug --console=plain
          fi

      - name: 收集产物
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: komo-apk
          path: out/*.apk
          if-no-files-found: error

      # App 的「检查更新」对话框直接显示 release 正文，所以说明得是人话。
      # GitHub 自动生成的那份基本只有 PR 标题，这里是本仓库实际的提交记录。
      - name: 生成更新说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "对比 $prev 的改动：" > release.md
            echo >> release.md
            git log --no-merges --pretty=format:'- %s' "$prev..$GITHUB_REF_NAME" >> release.md
          else
            echo "首个正式发布。" > release.md
            echo >> release.md
            git log --no-merges --pretty=format:'- %s' >> release.md
          fi
          echo >> release.md
          echo >> release.md
          echo "安装包：komo-${GITHUB_REF_NAME#v}.apk（覆盖安装即可，追番和下载记录都在）" >> release.md
          cat release.md

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: release.md
